[general]
# import = ["themes/minimal-custom.toml"]
import = ["~/.current-theme/alacritty-theme.toml"]

[selection]
save_to_clipboard = true

[window]
padding = { x = 0, y = 5 }
decorations = "none"

[font]
size = 12
normal.family = "0xProto Nerd Font"

[mouse]
hide_when_typing = true

[[hints.enabled]]
command = "xdg-open"   # On Linux/BSD
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
mouse.mods = "Control"

[[keyboard.bindings]]
key = "Backspace"
mods = "Control"
chars = "\u0017"  # C-w

[[keyboard.bindings]]
key = "Return"
mods = "Super|Shift"
action = "SpawnNewInstance"

[[keyboard.bindings]]
key = "Z"
mods = "Super"
command.program = "alacritty"
command.args = [
  "--class",
  "scratch.term",
  "-o",
  'keyboard.bindings=[{key="Z",mods="Super",action="Quit"}]',
]

[[keyboard.bindings]]
key = "PageUp"
mode = "~Alt"
action = "ScrollHalfPageUp"

[[keyboard.bindings]]
key = "PageDown"
mode = "~Alt"
action = "ScrollHalfPageDown"

[[keyboard.bindings]]
key = "S"
mode = "Vi|~Search"
action = "SearchForward"

[[keyboard.bindings]]
key = "S"
mods = "Shift"
mode = "Vi|~Search"
action = "SearchBackward"

[[keyboard.bindings]]
key = "C"
mods = "Shift|Control"
action = "Copy"
