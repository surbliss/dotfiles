### List of grammars that `hx --grammar fetch` gets. Only manual ones, since the rest are build together with helix
use-grammars.only = ["cabal", "kanata", "rocq", "d2"]

##################################################
# Language-server configurations
##################################################

[language-server.snippets]
command = "simple-completion-language-server"

[language-server.snippets.config]
feature_words = false  # enable completion by word
feature_snippets = true  # enable snippets
snippets_first = true  # completions will return before snippets by default
snippets_inline_by_word_tail = false  # suggest snippets by WORD tail, for example text `xsq|` become `x^2|` when snippet `sq` has body `^2`
feature_unicode_input = false  # enable "unicode input"
feature_paths = false  # enable path completion
feature_citations = false  # enable citation completion (only on `citation` feature enabled)

# Empty definitions after 'snippets', to make sure snippets show up first in menu
[language-server.nixd]

[language-server.nil]

# [language-server.ty.config]
# interpreter = ["$PYTHONPATH"]
[language-server.nil.config]
nix.flake.autoArchive = true
nix.flake.autEvalInputs = true

[language-server.rust-analyzer]

[language-server.fsharp-ls]
command = "fsautocomplete"
args = ["--verbose"]
config = { AutomaticWorkspaceInit = true, FSharp = { ExternalAutocomplete = true } }

[language-server.haskell-language-server.config]
haskell.formattingProvider = "fourmolu"
haskell.sessionLoading = "multipleComponents"

[language-server.tinymist]
command = "tinymist"
# args = ["lsp"]

[language-server.tinymist.config]
formatterMode = "typstyle"
exportPdf = "onType"
outputPath = "$root/out/$name"
formatterPrintWidth = 80
lint.enabled = true
lint.when = "onType"
projectResolution = "lockDatabase"
# projectResolution = "singleFile"
# typstExtraArgs = ["main.typ"]

# Need both commands, evnen though top one is default
preview.background.enabled = true
preview.background.args = [
  "--data-plane-host=127.0.0.1:23635",
  "--invert-colors=never",
]
typingContinueCommentsOnNewLine = false

[language-server.elm-language-server]
command = "elm-language-server"
args = ["--stdio"]

### Rocq
[language-server.vsrocqtop]
command = "vsrocqtop"

[language-server.rumdl.config]
flavor = "standard"

[language-server.rumdl.config.MD013]
line-length = 80
paragraphs = false
code-blocks = true
tables = true
reflow = true
reflow-mode = "sentence-per-line"

[language-server.harper-ls.config.harper-ls.linters]
SpellCheck = false
# SentenceCapitalization = false
OrthographicConsistency = false

##################################################
# Languages
##################################################
[[language]]
name = "fsharp"
scope = "source.fs"
roots = ["fsproj", "sln", ".git"]
file-types = ["fs", "fsx", "fsi"]
language-servers = ["fsharp-ls"]
# comment-token = "//"
indent = { tab-width = 4, unit = " " }
auto-format = true

[[language]]
name = "kanata"
scope = "source.kanata"
file-types = ["kbd"]
comment-tokens = [";;"]
block-comment-tokens = [{ start = "#|", end = "|#" }]

# [[language]]
# name = "haskell"
# auto-format = true
# roots = ["Setup.hs", "stack.yaml", "cabal.project", "src/"]

[[language]]
name = "haskell"
scope = "source.haskell"
injection-regex = "hs|haskell"
file-types = ["hs", "hs-boot", "hsc"]
roots = ["Setup.hs", "stack.yaml", "cabal.project", "hie.yaml", "src/"]
shebangs = ["runhaskell", "stack"]
comment-token = "--"
block-comment-tokens = { start = "{-", end = "-}" }
language-servers = ["haskell-language-server"]
indent = { tab-width = 2, unit = "  " }
# NOTE: Enable when figured out how to prevent stalling...
auto-format = true

[[language]]
name = "cabal"
auto-format = true

[[language]]
name = "d2"
scope = "source.d2"
injection-regex = "^d2$"
file-types = ["d2"]
grammar = "d2"
comment-token = "#"
formatter = { command = "d2", args = ["fmt", "-"] }
# formatter = { command = "d2", args = ["fmt", "-"] }
# auto-format = true

[[language]]
name = "just"
auto-format = true
# formatter.command = "just"
# formatter.args = ["--fmt"]
