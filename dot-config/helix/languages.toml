[[language]]
name = "rust"
language-servers = ["snippets", "rust-analyzer"]

[language.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
'"' = '"'

[[language]]
name = "typst"
formatter = ["typstyle"]
roots = ["main.typ", "out/", "tinymist.lock"]
auto-format = true

[language.auto-pairs]
'"' = '"'
"`" = "`"
"(" = ")"
"{" = "}"
"[" = "]"
"$" = "$"

[[language]]
name = "rocq"
scope = "source.rocq"
injection-regex = "^rocq$"
file-types = ["v"]
grammar = "rocq"
block-comment-tokens = { start = "(*", end = "*)" }
indent = { tab-width = 2, unit = "  " }
language-servers = ["vsrocqtop"]

[[language]]
name = "hyprlang"
scope = "source.hyprlang"
roots = ["hyprland.conf"]
file-types = [{ glob = "hypr/*.conf" }, { glob = "mango/**/*.conf" }]
comment-token = "#"
grammar = "hyprlang"
language-servers = ["hyprls"]

# Base copied from upstream, so more configs can be added
[[language]]
name = "ini"
scope = "source.ini"
file-types = [
  "ini",
  "desktop",
  { glob = "mimeapps.list" },
  # Podman quadlets
  "container",
  "volume",
  "kube",
  "network",
  { glob = ".editorconfig" },
  { glob = ".npmrc" },
  { glob = "hgrc" },
  { glob = "npmrc" },
  { glob = "rclone.conf" },
  { glob = ".aws/config" },
  "properties",
  "cfg",
  "directory",
  { glob = ".wslconfig" },
]
injection-regex = "ini"
comment-token = "#"
indent = { tab-width = 4, unit = "\t" }

##################################################
# Grammars
##################################################
[[grammar]]
name = "kanata"
source = { git = "https://github.com/postsolar/tree-sitter-kanata/", rev = "master" }

[[grammar]]
name = "rocq"
source = { git = "https://github.com/smirnov-in/tree-sitter-rocq", rev = "main" }

[[grammar]]
name = "d2"
source = { git = "https://github.com/ravsii/tree-sitter-d2", rev = "main" }

[[grammar]]
name = "cabal"
source.git = "https://gitlab.com/magus/tree-sitter-cabal"
source.rev = "eed27a619d96c5762aa7f7d323f5009c5eb3e56e"
