[[language]]
name = "kdl"
# auto-format = true

[[language]]
name = "nix"
auto-format = true
text-width = 80
formatter.command = "nixfmt"
formatter.args = ["--width=80", "--strict", "--verify"]
language-servers = ["nil", "nixd", "snippets"]

[language.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
'"' = '"'
"=" = ";"

[[language]]
name = "toml"
auto-format = true
language-servers = ["tombi"]
formatter = { command = "tombi", args = ["format", "-"] }

[[language]]
name = "c-sharp"
formatter = { command = "csharpier", args = ["format"] }
auto-format = true

[[language]]
name = "c"
auto-format = true

[language.auto-pairs]
"(" = ")"
"{" = "}"
"[" = "]"
'"' = '"'
"'" = "'"

[[language]]
name = "nim"
formatter = { command = "nph", args = ["-"] }
auto-format = true

[[language]]
name = "lua"
auto-format = true

[[language]]
name = "bash"
# Copied from offical
file-types = [
  { glob = "dot-zshenv" },
  { glob = "dot-zshrc" },
  "sh",
  "bash",
  "ash",
  "dash",
  "ksh",
  "mksh",
  "zsh",
  "zshenv",
  "zlogin",
  "zlogout",
  "zprofile",
  "zshrc",
  "eclass",
  "ebuild",
  "bazelrc",
  "Renviron",
  "zsh-theme",
  "cshrc",
  "tcshrc",
  "bashrc_Apple_Terminal",
  "zshrc_Apple_Terminal",
  { glob = "i3/config" },
  { glob = "sway/config" },
  { glob = "tmux.conf" },
  { glob = ".bash_history" },
  { glob = ".bash_login" },
  { glob = ".bash_logout" },
  { glob = ".bash_profile" },
  { glob = ".bashrc" },
  { glob = ".profile" },
  { glob = ".zshenv" },
  { glob = ".zlogin" },
  { glob = ".zlogout" },
  { glob = ".zprofile" },
  { glob = ".zshrc" },
  { glob = ".zimrc" },
  { glob = "APKBUILD" },
  { glob = ".bash_aliases" },
  { glob = ".Renviron" },
  { glob = ".xprofile" },
  { glob = ".xsession" },
  { glob = ".xsessionrc" },
  { glob = ".yashrc" },
  { glob = ".yash_profile" },
  { glob = ".hushlogin" },
