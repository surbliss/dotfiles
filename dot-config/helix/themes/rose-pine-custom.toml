"hint" = { fg = "foam", bg = "foam_10" }
"info" = { fg = "iris", bg = "iris_10" }
"warning" = { fg = "gold", bg = "gold_10" }
"error" = { fg = "love", bg = "love_10" }

"diagnostic.unnecessary".modifiers = []
"diagnostic.hint" = { underline.style = "line", underline.color = "foam" }
"diagnostic.info" = { underline.style = "line", underline.color = "iris" }
"diagnostic.warning" = { underline.style = "dotted", underline.color = "gold" }
"diagnostic.error" = { underline.style = "curl", underline.color = "love" }

# Separate colour added to palette for comments, to make them stand out more
"comment" = { fg = "nice_green", modifiers = ["italic"] }
"comment.documentation" = { fg = "nice_green", modifiers = ["bold"] }
"comment.line.documentation" = { fg = "nice_green", modifiers = ["bold"] }
"comment.block.documentation" = { fg = "nice_green", modifiers = ["bold"] }

[palette]
nice_green = "#9bbb88"
