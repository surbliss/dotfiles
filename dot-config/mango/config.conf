# Misc
xwayland_persistence=1
syncobj_enable=0
axis_bind_apply_timeout=100
focus_on_activate=0
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
circle_layout=scroller,tile
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1


# sub config load
source=./visual.conf
source=./layout.conf
source=./input.conf
source=./env.conf
source=./bind.conf
source=./window-rule.conf
source=./monitor.conf
source=./tag.conf
source=./autostart.conf

source=./dms/outputs.conf
