### Input configuration

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=dk
xkb_rules_variant=nodeadkeys
xkb_rules_options=caps:escape,compose:menu


# Trackpad
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1
trackpad_accel_profile=1 # 1 just means that you can change the speed, not that pointer-acceleration is actually enabled.
trackpad_accel_speed=0.0

# Mouse
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0.0

