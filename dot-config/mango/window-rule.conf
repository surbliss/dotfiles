### Window Rules
# Pdf
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^sioyek$
windowrule=unfocused_opacity:1.0,focused_opacity:1.0,appid:^org.pwmt.zathura$


# Browser-
windowrule=appid:^zen-twilight$,tags:1,unfocused_opacity:1
windowrule=appid:^org.qutebrowser.qutebrowser$,tags:1,unfocused_opacity:1
windowrule=appid:^Alacritty$,scroller_proportion_single:0.6

# From dms docs
layerrule=noanim:1,layer_name:^dms
windowrule=isfloating:1,appid:^org\.quickshell$


